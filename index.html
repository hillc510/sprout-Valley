<title>Sprout Valley Adventure</title>
<style>
  html,body{margin:0;height:100%;font-family:ui-rounded,'Arial Rounded MT Bold','Nunito','Trebuchet MS',sans-serif;
    background:linear-gradient(#4fb3ff 0%,#a9e0ff 62%,#6cc84b 62%,#3f9a36 100%);color:#2b1b4d}
  .wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
  .card{background:rgba(255,253,246,.96);border:4px solid #2b1b4d;border-radius:28px;padding:22px 24px;max-width:380px;width:100%;
    text-align:center;box-shadow:0 10px 0 rgba(20,10,40,.25)}
  img{width:84px;height:84px;border-radius:20px;border:3px solid #2b1b4d}
  h1{margin:10px 0 4px;font-size:30px;font-weight:900;color:#ffb21f;-webkit-text-stroke:1.5px #3a1f6b;letter-spacing:.5px}
  p{margin:4px 0 14px;font-size:17px;font-weight:700}
  input{width:100%;box-sizing:border-box;font:inherit;font-size:20px;font-weight:800;padding:12px 14px;border-radius:16px;
    border:3px solid #2b1b4d;text-align:center;outline:none;background:#fff}
  input:focus{border-color:#3d8bff}
  button{margin-top:12px;width:100%;font:inherit;font-size:22px;font-weight:900;padding:12px;border-radius:999px;border:3px solid #16502c;
    color:#fff;background:linear-gradient(#5fdc7a,#2fa64e);cursor:pointer}
  button:disabled{opacity:.6}
  .bar{height:12px;border-radius:6px;border:2px solid #2b1b4d;background:#fff;margin-top:12px;overflow:hidden;display:none}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd23f,#ff9f1c)}
  .err{min-height:22px;margin-top:10px;font-weight:800;color:#c2255c}
  .shake{animation:sh .4s}
  @keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  @media (max-height:500px){.card{padding:12px 20px}img{width:52px;height:52px;border-radius:14px}h1{font-size:24px;margin:4px 0 2px}p{margin:2px 0 8px;font-size:15px}input{padding:8px;font-size:18px}button{margin-top:8px;padding:8px;font-size:19px}.err{margin-top:6px}}

<div class="wrap"><form class="card" id="f" autocomplete="off">

  <input id="pw" type="password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Password" enterkeyhint="go">

<script>"use strict";

                }

                for (i = 0; i < 64; i++) {
                    t1 = ((((((e>>>6) | (e<<(32-6))) ^ ((e>>>11) | (e<<(32-11))) ^
                             ((e>>>25) | (e<<(32-25)))) + ((e & f) ^ (~e & g))) | 0) +

                    g = f;
                    f = e;

                    c = b;

                h1 = (h1 + b) | 0;
                h2 = (h2 + c) | 0;
                h3 = (h3 + d) | 0;
                h4 = (h4 + e) | 0;

        let i, bytesLeft = m.length % 64,
        bitLenHi = (m.length / 0x20000000) | 0,
        bitLenLo = m.length << 3,
        numZeros = (bytesLeft < 56) ? 56 : 120,
        p = m.slice(m.length - bytesLeft, m.length);

        p.push(0x80);
        for (i = bytesLeft + 1; i < numZeros; i++) { p.push(0); }
        p.push((bitLenHi >>> 24) & 0xff);
        p.push((bitLenHi >>> 16) & 0xff);
        p.push((bitLenHi >>> 8)  & 0xff);
        p.push((bitLenHi >>> 0)  & 0xff);
        p.push((bitLenLo >>> 24) & 0xff);
        p.push((bitLenLo >>> 16) & 0xff);
        p.push((bitLenLo >>> 8)  & 0xff);
        p.push((bitLenLo >>> 0)  & 0xff);

        blocks(p);

        return [
            (h0 >>> 24) & 0xff, (h0 >>> 16) & 0xff, (h0 >>> 8) & 0xff, (h0 >>> 0) & 0xff,
            (h1 >>> 24) & 0xff, (h1 >>> 16) & 0xff, (h1 >>> 8) & 0xff, (h1 >>> 0) & 0xff,
            (h2 >>> 24) & 0xff, (h2 >>> 16) & 0xff, (h2 >>> 8) & 0xff, (h2 >>> 0) & 0xff,
            (h3 >>> 24) & 0xff, (h3 >>> 16) & 0xff, (h3 >>> 8) & 0xff, (h3 >>> 0) & 0xff,
            (h4 >>> 24) & 0xff, (h4 >>> 16) & 0xff, (h4 >>> 8) & 0xff, (h4 >>> 0) & 0xff,
            (h5 >>> 24) & 0xff, (h5 >>> 16) & 0xff, (h5 >>> 8) & 0xff, (h5 >>> 0) & 0xff,
            (h6 >>> 24) & 0xff, (h6 >>> 16) & 0xff, (h6 >>> 8) & 0xff, (h6 >>> 0) & 0xff,
            (h7 >>> 24) & 0xff, (h7 >>> 16) & 0xff, (h7 >>> 8) & 0xff, (h7 >>> 0) & 0xff
        ];
    }

    function PBKDF2_HMAC_SHA256_OneIter(password, salt, dkLen) {
        // compress password if it's longer than hash block length
        password = (password.length <= 64) ? password : SHA256(password);

        const innerLen = 64 + salt.length + 4;
        const inner = new Array(innerLen);
        const outerKey = new Array(64);

        let i;
        let dk = [];

        // inner = (password ^ ipad) || salt || counter
        for (i = 0; i < 64; i++) { inner[i] = 0x36; }
        for (i = 0; i < password.length; i++) { inner[i] ^= password[i]; }
        for (i = 0; i < salt.length; i++) { inner[64 + i] = salt[i]; }
        for (i = innerLen - 4; i < innerLen; i++) { inner[i] = 0; }

        // outerKey = password ^ opad
        for (i = 0; i < 64; i++) outerKey[i] = 0x5c;
        for (i = 0; i < password.length; i++) outerKey[i] ^= password[i];

        // increments counter inside inner
        function incrementCounter() {
            for (let i = innerLen - 1; i >= innerLen - 4; i--) {
                inner[i]++;

                inner[i] = 0;
            }

        // output blocks = SHA256(outerKey || SHA256(inner)) ...
        while (dkLen >= 32) {
            incrementCounter();
            dk = dk.concat(SHA256(outerKey.concat(SHA256(inner))));
            dkLen -= 32;

        if (dkLen > 0) {
            incrementCounter();
            dk = dk.concat(SHA256(outerKey.concat(SHA256(inner))).slice(0, dkLen));
        }

    // See: https://www.npmjs.com/package/scryptsy

            x[ 0] ^= R(x[12] + x[ 8], 18);
            x[ 9] ^= R(x[ 5] + x[ 1], 7);
            x[13] ^= R(x[ 9] + x[ 5], 9);
            x[ 1] ^= R(x[13] + x[ 9], 13);
            x[ 5] ^= R(x[ 1] + x[13], 18);

            x[10] ^= R(x[ 6] + x[ 2], 18);

            x[ 7] ^= R(x[ 3] + x[15], 9);
            x[11] ^= R(x[ 7] + x[ 3], 13);
            x[15] ^= R(x[11] + x[ 7], 18);
            x[ 1] ^= R(x[ 0] + x[ 3], 7);
            x[ 2] ^= R(x[ 1] + x[ 0], 9);
            x[ 3] ^= R(x[ 2] + x[ 1], 13);
            x[ 0] ^= R(x[ 3] + x[ 2], 18);
            x[ 6] ^= R(x[ 5] + x[ 4], 7);
            x[ 7] ^= R(x[ 6] + x[ 5], 9);
            x[ 4] ^= R(x[ 7] + x[ 6], 13);
            x[ 5] ^= R(x[ 4] + x[ 7], 18);
            x[11] ^= R(x[10] + x[ 9], 7);
            x[ 8] ^= R(x[11] + x[10], 9);
            x[ 9] ^= R(x[ 8] + x[11], 13);
            x[10] ^= R(x[ 9] + x[ 8], 18);
            x[12] ^= R(x[15] + x[14], 7);
            x[13] ^= R(x[12] + x[15], 9);

        const _X = new Uint32Array(16);      // blockmix_salsa8

        let i0 = 0, i1;

                    state = 1;                                         // Move to ROMix 2
                    i1 = 0;

                    // Run up to 1000 steps of the first inner smix loop

                    for (let i = 0; i < steps; i++) {                  // ROMix - 2
                        arraycopy(XY, 0, V, (i1 + i) * Yi, Yi)         // ROMix - 3
                        blockmix_salsa8(XY, Yi, r, x, _X);             // ROMix - 4
                    }

                    // for (var i = 0; i < N; i++)
                    i1 += steps;
                    currentOp += steps;

                    if (callback) {
                        // Call the callback with the progress (optionally stopping us)
                        const percent10 = parseInt(1000 * currentOp / totalOps);
                        if (percent10 !== lastPercent10) {
                            stop = callback(null, currentOp / totalOps);
                            if (stop) { break; }
                            lastPercent10 = percent10;
                        }
                    }

                    if (i1 < N) { break; }

                    i1 = 0;                                          // Move to ROMix 6
                    state = 2;

                    // Fall through

                case 2:

                    // Run up to 1000 steps of the second inner smix loop
                    steps = N - i1;
                    if (steps > limit) { steps = limit; }
                    for (let i = 0; i < steps; i++) {                // ROMix - 6
                        const offset = (2 * r - 1) * 16;             // ROMix - 7
                        const j = XY[offset] & (N - 1);
                        blockxor(V, j * Yi, XY, Yi);                 // ROMix - 8 (inner)
                        blockmix_salsa8(XY, Yi, r, x, _X);           // ROMix - 9 (outer)
                    }

                    // for (var i = 0; i < N; i++)...
                    i1 += steps;
                    currentOp += steps;

                    // Call the callback with the progress (optionally stopping us)
                    if (callback) {
                        const percent10 = parseInt(1000 * currentOp / totalOps);
                        if (percent10 !== lastPercent10) {
                            stop = callback(null, currentOp / totalOps);
                            if (stop) { break; }
                            lastPercent10 = percent10;
                        }
                    }

                    if (i1 < N) { break; }

                    arraycopy(XY, 0, B, Bi, Yi);                     // ROMix - 10

                    // for (var i = 0; i < p; i++)...
                    i0++;
                    if (i0 < p) {
                        state = 0;
                        break;
                    }

                    b = [];
                    for (let i = 0; i < B.length; i++) {
                        b.push((B[i] >>  0) & 0xff);
                        b.push((B[i] >>  8) & 0xff);
                        b.push((B[i] >> 16) & 0xff);
                        b.push((B[i] >> 24) & 0xff);
                    }

                    const derivedKey = PBKDF2_HMAC_SHA256_OneIter(password, b, dkLen);

                    // Send the result to the callback
                    if (callback) { callback(null, 1.0, derivedKey); }

                    // Done; don't break (which would reschedule)
                    return derivedKey;
            }

            // Schedule the next steps
            if (callback) { nextTick(incrementalSMix); }
        }

        // Run the smix state machine until completion
        if (!callback) {
            while (true) {
                const derivedKey = incrementalSMix();
                if (derivedKey != undefined) { return derivedKey; }
            }
        }

        // Bootstrap the async incremental smix
        incrementalSMix();
    }

    const lib = {
        scrypt: function(password, salt, N, r, p, dkLen, progressCallback) {
            return new Promise(function(resolve, reject) {
                let lastProgress = 0;
                if (progressCallback) { progressCallback(0); }
                _scrypt(password, salt, N, r, p, dkLen, function(error, progress, key) {
                    if (error) {
                        reject(error);
                    } else if (key) {
                        if (progressCallback && lastProgress !== 1) {
                            progressCallback(1);
                        }
                        resolve(new Uint8Array(key));
                    } else if (progressCallback && progress !== lastProgress) {
                        lastProgress = progress;
                        return progressCallback(progress);
                    }

        }
    };

    if (typeof(exports) !== 'undefined') {
       module.exports = lib;

    // RequireJS/AMD
    // http://www.requirejs.org/docs/api.html
    // https://github.com/amdjs/amdjs-api/wiki/AMD
    } else if (typeof(define) === 'function' && define.amd) {

    } else if (root) {

        if (root.scrypt) {
            root._scrypt = root.scrypt;
        }

        root.scrypt = lib;
    }

})(this);

const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64=u=>btoa(String.fromCharCode.apply(null,u));
const $=id=>document.getElementById(id);
const f=$('f'), inp=$('pw'), err=$('err'), btn=$('go'), bar=$('bar'), fill=$('fill'), msg=$('msg');
let fails=0, lockedUntil=0;
async function open(rawKey, remember){
  const key=await crypto.subtle.importKey('raw',rawKey,{name:'AES-GCM'},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(IV)},key,ub(DATA));   // throws if wrong
  if(remember){ try{ localStorage.setItem('sv_key2',b64(rawKey)); }catch(e){} }
  const html=new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
}
async function derive(pw){
  bar.style.display='block'; fill.style.width='0';
  const k=await scrypt.scrypt(new TextEncoder().encode(pw.trim().toLowerCase()), ub(SALT), N, R, P, 32, p=>{ fill.style.width=Math.round(p*100)+'%'; });
  return new Uint8Array(k);
}
f.addEventListener('submit',async e=>{ e.preventDefault();
  const now=Date.now(); if(now<lockedUntil){ err.textContent='Please wait a moment and try again.'; return; }
  btn.disabled=true; inp.disabled=true; err.textContent=''; msg.textContent='Unlocking… this takes a few seconds';
  try{ const k=await derive(inp.value); await open(k,true); }
  catch(x){ fails++; btn.disabled=false; inp.disabled=false; bar.style.display='none'; msg.textContent='Enter the family password to play';
    if(fails>=5){ lockedUntil=Date.now()+30000; fails=0; err.textContent='Too many tries. Wait 30 seconds.'; }
    else err.textContent="Hmm, that's not it. Try again!";
    f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake'); inp.select(); }
});
(async()=>{ let saved=null; try{ saved=localStorage.getItem('sv_key2'); }catch(e){}
  if(saved){ try{ await open(ub(saved),false); return; }catch(e){ try{ localStorage.removeItem('sv_key2'); }catch(_){ } } }
  inp.focus(); })();
})();
